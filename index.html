<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Stok Bahan Banner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
.container{max-width:1100px;margin:auto;padding:16px}
header{background:linear-gradient(135deg,#111827,#374151);color:#fff;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 8px 25px #0002}
h1{margin:0 0 5px;font-size:27px}.subtitle{opacity:.82}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.summary div{background:#ffffff16;border:1px solid #ffffff20;padding:12px;border-radius:13px}
.summary strong{display:block;font-size:23px;margin-top:4px}
.material{background:#fff;border-radius:18px;margin-bottom:18px;padding:18px;box-shadow:0 5px 20px #0000000c}
.material-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.material-title h2{margin:0;font-size:23px}.total-material{font-weight:bold;color:#374151}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border:1px solid #e5e7eb;border-radius:15px;padding:16px}
.badge{display:inline-block;background:#e5e7eb;padding:5px 9px;border-radius:20px;font-size:12px;margin-bottom:10px}
.card h3{margin:0 0 5px}.stock{font-size:30px;font-weight:bold}.unit{font-size:14px;color:#6b7280;font-weight:normal}
.meter{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#16a34a;transition:.3s}.bar.low{background:#f59e0b}.bar.empty{background:#dc2626}
small{color:#6b7280}
label{font-size:12px;color:#4b5563;font-weight:bold;display:block;margin:12px 0 5px}
input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;padding:11px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:8px}
.use{background:#111827;color:white;width:100%}.reset{background:#fee2e2;color:#991b1b;width:100%}
.history{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #0000000c}.history h2{margin-top:0}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:13px}
.empty{text-align:center;color:#9ca3af;padding:18px}
.clear{background:#fee2e2;color:#991b1b;margin-bottom:12px}
footer{text-align:center;color:#6b7280;font-size:12px;padding:22px}
@media(max-width:750px){.grid,.summary{grid-template-columns:1fr}.container{padding:10px}.material{padding:13px}h1{font-size:23px}.material-title{align-items:flex-start;gap:8px;flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📦 STOK BAHAN BANNER</h1>
<div class="subtitle">Stok per rol — setiap rol berisi 70 meter</div>
<div class="summary">
<div>Total Awal<strong id="totalAwal">840 m</strong></div>
<div>Total Tersisa<strong id="totalSisa">840 m</strong></div>
<div>Total Terpakai<strong id="totalPakai">0 m</strong></div>
</div>
</header>
<div id="materials"></div>
<div class="history">
<h2>📋 Riwayat Pemakaian</h2>
<button class="clear" onclick="clearHistory()">🗑️ Hapus Riwayat</button>
<div class="table-wrap"><table>
<thead><tr><th>Tanggal</th><th>Bahan</th><th>Ukuran</th><th>Pemakaian</th><th>Sisa</th></tr></thead>
<tbody id="history"></tbody>
</table></div>
<div id="empty" class="empty">Belum ada pemakaian.</div>
</div>
<footer>Data stok tersimpan otomatis di browser perangkat ini.</footer>
</div>
<script>
const INITIAL=70;
const materials=["280","340","440","510"];
const sizes=["1 Meter","2 Meter","3 Meter"];
let data=JSON.parse(localStorage.getItem("stokBahanBanner"))||{};
materials.forEach(m=>{
 if(!data[m]) data[m]={};
 sizes.forEach(s=>{if(!data[m][s]) data[m][s]={stock:70,history:[]};});
});
function save(){localStorage.setItem("stokBahanBanner",JSON.stringify(data))}
function fmt(n){return Number(n).toFixed(2).replace(/\.00$/,"")}
function render(){
 let total=0; materials.forEach(m=>sizes.forEach(s=>total+=data[m][s].stock));
 document.getElementById("totalSisa").textContent=fmt(total)+" m";
 document.getElementById("totalPakai").textContent=fmt(840-total)+" m";
 const wrap=document.getElementById("materials"); wrap.innerHTML="";
 materials.forEach(m=>{
   let mt=0;sizes.forEach(s=>mt+=data[m][s].stock);
   let section=document.createElement("section");section.className="material";
   section.innerHTML=`<div class="material-title"><h2>BAHAN ${m}</h2><div class="total-material">Total tersisa: ${fmt(mt)} m</div></div><div class="grid" id="grid-${m}"></div>`;
   wrap.appendChild(section);
   const grid=section.querySelector(".grid");
   sizes.forEach(s=>{
     const item=data[m][s], pct=Math.max(0,Math.min(100,item.stock/INITIAL*100));
     const cls=pct<=0?"empty":pct<=25?"low":"";
     grid.innerHTML+=`
     <div class="card">
       <span class="badge">ROL ${s}</span>
       <h3>Banner ${m}</h3>
       <div class="stock">${fmt(item.stock)} <span class="unit">meter</span></div>
       <div class="meter"><div class="bar ${cls}" style="width:${pct}%"></div></div>
       <small>${fmt(pct)}% dari 70 meter tersisa</small>
       <label>Panjang pemakaian (meter)</label>
       <input id="input-${m}-${s}" type="number" min="0.01" max="${item.stock}" step="0.01" placeholder="Contoh: 2.5">
       <button class="use" onclick="useStock('${m}','${s}')">➖ Kurangi Stok</button>
       <button class="reset" onclick="resetStock('${m}','${s}')">🔄 Reset ke 70 Meter</button>
     </div>`;
   });
 });
 renderHistory();
}
function useStock(m,s){
 const input=document.getElementById(`input-${m}-${s}`), amount=parseFloat(input.value);
 if(!amount||amount<=0){alert("Masukkan jumlah meter yang valid.");return}
 if(amount>data[m][s].stock){alert("Stok tidak mencukupi.");return}
 data[m][s].stock=Math.round((data[m][s].stock-amount)*100)/100;
 data[m][s].history.unshift({date:new Date().toLocaleString("id-ID"),amount,remaining:data[m][s].stock});
 save();render();
}
function resetStock(m,s){
 if(confirm(`Reset stok bahan ${m} ukuran ${s} kembali menjadi 70 meter?`)){
   data[m][s].stock=INITIAL;
   data[m][s].history.unshift({date:new Date().toLocaleString("id-ID"),amount:"RESET",remaining:INITIAL});
   save();render();
 }
}
function renderHistory(){
 let rows=[];
 materials.forEach(m=>sizes.forEach(s=>data[m][s].history.forEach(h=>rows.push({m,s,...h}))));
 rows.reverse();
 const tbody=document.getElementById("history");
 tbody.innerHTML=rows.map(h=>`<tr><td>${h.date}</td><td>Banner ${h.m}</td><td>${h.s}</td><td>${h.amount==="RESET"?"Reset stok":"-"+fmt(h.amount)+" m"}</td><td>${fmt(h.remaining)} m</td></tr>`).join("");
 document.getElementById("empty").style.display=rows.length?"none":"block";
}
function clearHistory(){
 if(confirm("Hapus semua riwayat pemakaian? Stok tidak akan berubah.")){
   materials.forEach(m=>sizes.forEach(s=>data[m][s].history=[]));save();render();
 }
}
render();
</script>
</body>
</html>
