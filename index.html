<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StokPro V2 — Admin & Kasir</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script></head>
<body class="bg-slate-100 text-slate-800"><div id="app"></div>
<script>
const KEY='stokpro_v2';
const seed={products:[{id:'P001',name:'Ayam Crispy',category:'Produk',stock:120,unit:'pcs',buy:9000,sell:15000,min:20},{id:'P002',name:'Nasi Putih',category:'Produk',stock:80,unit:'pcs',buy:2500,sell:5000,min:20},{id:'P003',name:'Saus',category:'Bahan',stock:18,unit:'botol',buy:12000,sell:18000,min:10}],customers:[{id:'C001',name:'Umum',phone:'-'},{id:'C002',name:'PT Maju Jaya',phone:'08123456789'}],sales:[],movements:[],outlets:[{id:'O001',name:'Outlet 1'}]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed; let state={page:'dashboard',role:'admin',cart:[],outlet:'O001'}; save();
const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID'); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function nav(){let admin=[['dashboard','Dashboard'],['products','Produk & Stok'],['movements','Riwayat Stok'],['customers','Customer'],['reports','Laporan']];return `<aside class="w-64 bg-slate-900 text-white min-h-screen p-5 fixed"><h1 class="text-2xl font-bold">Stok<span class="text-cyan-400">Pro</span></h1><p class="text-slate-400 text-xs mb-7">Admin • Gudang • Kasir</p><div class="grid grid-cols-2 gap-2 mb-5"><button onclick="setRole('admin')" class="rounded-lg px-2 py-2 text-xs ${state.role==='admin'?'bg-cyan-600':'bg-slate-800'}">Admin</button><button onclick="setRole('kasir')" class="rounded-lg px-2 py-2 text-xs ${state.role==='kasir'?'bg-emerald-600':'bg-slate-800'}">Kasir</button></div>${(state.role==='kasir'?[['cashier','🛒 Kasir'],['sales','Riwayat Penjualan']]:admin.concat([['cashier','🛒 Halaman Kasir']])).map(x=>`<button onclick="go('${x[0]}')" class="w-full text-left px-4 py-3 rounded-lg mb-2 ${state.page===x[0]?'bg-cyan-600':'hover:bg-slate-800'}">${x[1]}</button>`).join('')}<div class="mt-8 p-3 rounded-lg bg-slate-800 text-xs text-slate-300">Mode: <b>${state.role==='kasir'?'KASIR':'ADMIN'}</b><br><span class="text-cyan-400">Data tersimpan di browser</span></div></aside>`}
function shell(c){document.getElementById('app').innerHTML=`<div class="flex">${nav()}<main class="ml-64 flex-1 p-8">${c}</main></div>`}
function dashboard(){let today=new Date().toISOString().slice(0,10),sales=db.sales.filter(s=>s.date===today),total=sales.reduce((a,s)=>a+s.total,0);shell(`<div class="flex justify-between mb-7"><div><h2 class="text-3xl font-bold">Dashboard</h2><p class="text-slate-500">Ringkasan operasional</p></div><button onclick="go('cashier')" class="bg-emerald-600 text-white px-5 py-3 rounded-lg">🛒 Buka Kasir</button></div><div class="grid md:grid-cols-4 gap-4 mb-7">${[['Penjualan Hari Ini',money(total)],['Transaksi',sales.length],['Produk',db.products.length],['Stok Menipis',db.products.filter(p=>p.stock<=p.min).length]].map(x=>`<div class="bg-white rounded-xl p-5 shadow-sm"><p class="text-slate-500 text-sm">${x[0]}</p><div class="text-2xl font-bold mt-2">${x[1]}</div></div>`).join('')}</div><div class="bg-white rounded-xl p-6"><h3 class="font-bold mb-4">Transaksi Terbaru</h3>${sales.length?`<table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="py-3">Invoice</th><th>Customer</th><th>Total</th><th></th></tr></thead><tbody>${sales.slice(0,10).map(s=>`<tr class="border-b"><td class="py-3">${esc(s.no)}</td><td>${esc(s.customer)}</td><td>${money(s.total)}</td><td><button onclick="invoice('${s.no}')" class="text-cyan-600">Invoice</button></td></tr>`).join('')}</tbody></table>`:'<p class="text-slate-500">Belum ada transaksi hari ini.</p>'}</div>`)}
function products(){shell(`<div class="flex justify-between mb-6"><div><h2 class="text-3xl font-bold">Produk & Stok</h2><p class="text-slate-500">Tambah stok, stok minimum, harga beli & jual</p></div><button onclick="addProduct()" class="bg-cyan-600 text-white px-5 py-3 rounded-lg">+ Tambah Produk</button></div><div class="bg-white rounded-xl p-5 shadow-sm overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="py-3">Kode</th><th>Produk</th><th>Stok</th><th>Min.</th><th>H. Beli</th><th>H. Jual</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${db.products.map(p=>`<tr class="border-b"><td class="py-3">${p.id}</td><td class="font-medium">${esc(p.name)}<div class="text-xs text-slate-400">${esc(p.category)} • ${p.unit}</div></td><td class="font-bold">${p.stock}</td><td>${p.min}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td>${p.stock<=p.min?'<span class="text-rose-600 font-semibold">Menipis</span>':'<span class="text-emerald-600">Aman</span>'}</td><td><button onclick="addStock('${p.id}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs">+ Stok Masuk</button> <button onclick="editProduct('${p.id}')" class="bg-slate-200 px-3 py-1.5 rounded-lg text-xs">Edit</button></td></tr>`).join('')}</tbody></table></div>`)}
function addStock(id){let p=db.products.find(x=>x.id===id),q=Number(prompt(`Jumlah ${p.name} yang masuk?`,10));if(!q||q<=0)return alert('Jumlah harus lebih dari 0.');let note=prompt('Keterangan / supplier?','Pembelian')||'Stok masuk';p.stock+=q;db.movements.unshift({id:Date.now(),date:new Date().toISOString(),type:'MASUK',product:p.name,productId:p.id,qty:q,note});save();products()}
function addProduct(){let name=prompt('Nama produk?');if(!name)return;let sell=Number(prompt('Harga jual?',10000)||0),buy=Number(prompt('Harga beli?',0)||0),unit=prompt('Satuan?','pcs')||'pcs',min=Number(prompt('Stok minimum?',10)||0);db.products.push({id:'P'+String(db.products.length+1).padStart(3,'0'),name,category:'Produk',stock:0,unit,buy,sell,min});save();products()}
function editProduct(id){let p=db.products.find(x=>x.id===id);let sell=prompt('Harga jual:',p.sell);if(sell!==null)p.sell=Number(sell)||p.sell;let min=prompt('Stok minimum:',p.min);if(min!==null)p.min=Number(min)||0;save();products()}
function movements(){shell(`<div class="mb-6"><h2 class="text-3xl font-bold">Riwayat Stok</h2><p class="text-slate-500">Semua stok masuk dan keluar tercatat otomatis</p></div><div class="bg-white rounded-xl p-5 overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="py-3">Tanggal</th><th>Tipe</th><th>Produk</th><th>Qty</th><th>Keterangan</th></tr></thead><tbody>${db.movements.map(m=>`<tr class="border-b"><td class="py-3">${new Date(m.date).toLocaleString('id-ID')}</td><td><span class="px-2 py-1 rounded ${m.type==='MASUK'?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-700'}">${m.type}</span></td><td>${esc(m.product)}</td><td>${m.qty}</td><td>${esc(m.note)}</td></tr>`).join('')||'<tr><td colspan="5" class="py-8 text-center text-slate-400">Belum ada pergerakan stok.</td></tr>'}</tbody></table></div>`)}
function cashier(){shell(`<div class="flex justify-between mb-6"><div><h2 class="text-3xl font-bold">Kasir</h2><p class="text-slate-500">Input penjualan — stok otomatis berkurang</p></div><div class="bg-white rounded-lg px-4 py-2">${new Date().toLocaleDateString('id-ID')}</div></div><div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 bg-white rounded-xl p-6"><div class="grid md:grid-cols-2 gap-4 mb-5"><div><label class="text-sm">Customer</label><select id="cust" class="w-full border rounded-lg p-3 mt-1">${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label class="text-sm">Produk</label><select id="prod" class="w-full border rounded-lg p-3 mt-1">${db.products.map(p=>`<option value="${p.id}" ${p.stock<=0?'disabled':''}>${esc(p.name)} — ${money(p.sell)} (stok ${p.stock})</option>`).join('')}</select></div></div><div class="flex gap-3 mb-6"><input id="qty" type="number" min="1" value="1" class="border rounded-lg p-3 w-28"><button onclick="addCart()" class="bg-cyan-600 text-white px-5 rounded-lg">+ Tambah ke Keranjang</button></div><div id="cartArea">${cartHtml()}</div></div><div class="bg-slate-900 text-white rounded-xl p-6 h-fit"><p class="text-slate-400">Total Belanja</p><div class="text-3xl font-bold mt-2">${money(cartTotal())}</div><button onclick="checkout()" class="w-full bg-emerald-500 text-white py-3 rounded-lg mt-6 font-bold">Bayar & Buat Invoice</button></div></div>`)}
function cartTotal(){return state.cart.reduce((a,i)=>a+i.qty*i.price,0)}
function cartHtml(){if(!state.cart.length)return '<div class="border rounded-lg p-8 text-center text-slate-400">Keranjang masih kosong.</div>';return `<div class="border rounded-lg overflow-hidden"><table class="w-full text-sm"><thead class="bg-slate-50"><tr class="text-left"><th class="p-3">Produk</th><th>Qty</th><th>Harga</th><th>Total</th><th></th></tr></thead><tbody>${state.cart.map((i,n)=>`<tr class="border-t"><td class="p-3">${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td><td><button onclick="removeCart(${n})" class="text-rose-600">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
function addCart(){let p=db.products.find(x=>x.id===document.getElementById('prod').value),q=Number(document.getElementById('qty').value);if(!p||q<1)return;if(q>p.stock)return alert(`Stok ${p.name} hanya ${p.stock}.`);let old=state.cart.find(i=>i.id===p.id);if(old){if(old.qty+q>p.stock)return alert('Jumlah melebihi stok tersedia.');old.qty+=q}else state.cart.push({id:p.id,name:p.name,qty:q,price:p.sell});cashier()}
function removeCart(i){state.cart.splice(i,1);cashier()}
function checkout(){if(!state.cart.length)return alert('Keranjang kosong.');let cid=document.getElementById('cust').value,c=db.customers.find(x=>x.id===cid),total=cartTotal();for(let i of state.cart){let p=db.products.find(x=>x.id===i.id);p.stock-=i.qty;db.movements.unshift({id:Date.now()+Math.random(),date:new Date().toISOString(),type:'KELUAR',product:p.name,productId:p.id,qty:i.qty,note:'Penjualan kasir'});}let no='INV-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+String(db.sales.length+1).padStart(4,'0');let s={no,date:new Date().toISOString().slice(0,10),customer:c?.name||'Umum',total,status:'Lunas',items:state.cart.map(i=>({...i}))};db.sales.unshift(s);state.cart=[];save();invoice(no)}
function invoice(no){let s=db.sales.find(x=>x.no===no);if(!s)return;let {jsPDF}=window.jspdf,doc=new jsPDF();doc.setFontSize(20);doc.text('INVOICE',150,20);doc.setFontSize(12);doc.text('STOKPRO',20,20);doc.text(s.no,20,32);doc.text('Tanggal: '+s.date,20,40);doc.text('Customer: '+s.customer,20,48);let y=65;doc.text('Produk',20,y);doc.text('Qty',115,y);doc.text('Harga',140,y);doc.text('Total',175,y);y+=10;s.items.forEach(i=>{doc.text(i.name,20,y);doc.text(String(i.qty),115,y);doc.text(money(i.price),140,y);doc.text(money(i.qty*i.price),175,y);y+=9});doc.line(20,y,195,y);doc.setFontSize(14);doc.text('TOTAL '+money(s.total),120,y+15);doc.save(s.no+'.pdf')}
function customers(){shell(`<div class="flex justify-between mb-6"><div><h2 class="text-3xl font-bold">Customer</h2></div><button onclick="addCustomer()" class="bg-cyan-600 text-white px-5 py-3 rounded-lg">+ Customer</button></div><div class="bg-white rounded-xl p-5"><table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="py-3">Kode</th><th>Nama</th><th>Telepon</th></tr></thead><tbody>${db.customers.map(c=>`<tr class="border-b"><td class="py-3">${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td></tr>`).join('')}</tbody></table></div>`)}
function addCustomer(){let name=prompt('Nama customer?');if(!name)return;db.customers.push({id:'C'+String(db.customers.length+1).padStart(3,'0'),name,phone:prompt('No. telepon?')||'-'});save();customers()}
function sales(){shell(`<div class="mb-6"><h2 class="text-3xl font-bold">Riwayat Penjualan</h2><p class="text-slate-500">Transaksi yang sudah dibuat kasir</p></div><div class="bg-white rounded-xl p-5 overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="py-3">Invoice</th><th>Tanggal</th><th>Customer</th><th>Total</th><th>Aksi</th></tr></thead><tbody>${db.sales.map(s=>`<tr class="border-b"><td class="py-3">${s.no}</td><td>${s.date}</td><td>${esc(s.customer)}</td><td>${money(s.total)}</td><td><button onclick="invoice('${s.no}')" class="text-cyan-600">PDF Invoice</button></td></tr>`).join('')||'<tr><td colspan="5" class="py-8 text-center text-slate-400">Belum ada penjualan.</td></tr>'}</tbody></table></div>`)}
function reports(){shell(`<div class="mb-6"><h2 class="text-3xl font-bold">Laporan</h2><p class="text-slate-500">Download laporan Excel</p></div><div class="grid md:grid-cols-3 gap-5">${[['Penjualan','exportSales()'],['Stok','exportStock()'],['Mutasi Stok','exportMovements()']].map(x=>`<div class="bg-white rounded-xl p-6"><h3 class="font-bold text-lg">${x[0]}</h3><p class="text-slate-500 text-sm my-4">Export ke .xlsx</p><button onclick="${x[1]}" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Download Excel</button></div>`).join('')}</div>`)}
function exportSales(){let ws=XLSX.utils.json_to_sheet(db.sales.flatMap(s=>s.items.map(i=>({Invoice:s.no,Tanggal:s.date,Customer:s.customer,Produk:i.name,Qty:i.qty,Harga:i.price,Total:i.qty*i.price}))));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Penjualan');XLSX.writeFile(wb,'laporan-penjualan.xlsx')}
function exportStock(){let ws=XLSX.utils.json_to_sheet(db.products.map(p=>({Kode:p.id,Produk:p.name,Kategori:p.category,Stok:p.stock,Satuan:p.unit,Stok_Minimum:p.min,Harga_Beli:p.buy,Harga_Jual:p.sell})));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Stok');XLSX.writeFile(wb,'laporan-stok.xlsx')}
function exportMovements(){let ws=XLSX.utils.json_to_sheet(db.movements.map(m=>({Tanggal:m.date,Tipe:m.type,Produk:m.product,Qty:m.qty,Keterangan:m.note})));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Mutasi');XLSX.writeFile(wb,'riwayat-stok.xlsx')}
function setRole(r){state.role=r;state.cart=[];go(r==='kasir'?'cashier':'dashboard')}
function go(p){state.page=p;({dashboard,products,movements,customers,reports,cashier,sales}[p]||dashboard)()}
go('dashboard');
</script></body></html>
