<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StokPro — Stok & Penjualan</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script></head><body class="bg-slate-100 text-slate-800"><div id="app"></div><script>
const state={page:'dashboard',products:[{id:'P001',name:'Ayam Crispy',category:'Produk',stock:120,unit:'pcs',buy:9000,sell:15000},{id:'P002',name:'Nasi Putih',category:'Produk',stock:80,unit:'pcs',buy:2500,sell:5000},{id:'P003',name:'Saus',category:'Bahan',stock:18,unit:'botol',buy:12000,sell:18000}],customers:[{id:'C001',name:'Umum',phone:'-'},{id:'C002',name:'PT Maju Jaya',phone:'08123456789'}],sales:[{no:'INV-20261005-001',date:'2026-10-05',customer:'Umum',total:450000,status:'Lunas'}]};
const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
function nav(){return `<aside class="w-64 bg-slate-900 text-white min-h-screen p-5 fixed"><h1 class="text-2xl font-bold mb-1">Stok<span class="text-cyan-400">Pro</span></h1><p class="text-slate-400 text-xs mb-8">Stok • Penjualan • Invoice</p>${[['dashboard','Dashboard'],['products','Produk & Stok'],['sales','Penjualan'],['customers','Customer'],['reports','Laporan']].map(x=>`<button onclick="go('${x[0]}')" class="w-full text-left px-4 py-3 rounded-lg mb-2 ${state.page===x[0]?'bg-cyan-600':'hover:bg-slate-800'}">${x[1]}</button>`).join('')}<div class="mt-10 p-3 rounded-lg bg-slate-800 text-xs text-slate-300">Versi 1 Prototype<br><span class="text-cyan-400">Siap dikembangkan</span></div></aside>`}
function shell(content){document.getElementById('app').innerHTML=`<div class="flex">${nav()}<main class="ml-64 flex-1 p-8">${content}</main></div>`}
function dashboard(){shell(`<div class="flex justify-between items-center mb-7"><div><h2 class="text-3xl font-bold">Dashboard</h2><p class="text-slate-500">Ringkasan usaha hari ini</p></div><button onclick="go('sales')" class="bg-cyan-600 text-white px-5 py-3 rounded-lg">+ Transaksi Penjualan</button></div><div class="grid md:grid-cols-4 gap-4 mb-7">${[['Penjualan Hari Ini',money(450000),'text-cyan-600'],['Transaksi',state.sales.length,'text-blue-600'],['Produk',state.products.length,'text-violet-600'],['Stok Menipis',state.products.filter(p=>p.stock<20).length,'text-rose-600']].map(x=>`<div class="bg-white rounded-xl p-5 shadow-sm"><p class="text-slate-500 text-sm">${x[0]}</p><div class="text-2xl font-bold mt-2 ${x[2]}">${x[1]}</div></div>`).join('')}</div><div class="bg-white rounded-xl p-6"><h3 class="font-bold mb-4">Penjualan Terbaru</h3><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="py-3">Invoice</th><th>Tanggal</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${state.sales.map(s=>`<tr class="border-b"><td class="py-3 font-medium">${s.no}</td><td>${s.date}</td><td>${s.customer}</td><td>${money(s.total)}</td><td><span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded">${s.status}</span></td><td><button onclick='invoice(${JSON.stringify(s)})' class="text-cyan-600">Invoice</button></td></tr>`).join('')}</tbody></table></div>`)}
function products(){shell(`<div class="flex justify-between mb-6"><div><h2 class="text-3xl font-bold">Produk & Stok</h2><p class="text-slate-500">Kelola barang dan saldo stok</p></div><button onclick="addProduct()" class="bg-cyan-600 text-white px-5 py-3 rounded-lg">+ Tambah Produk</button></div><div class="bg-white rounded-xl p-6 shadow-sm"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="py-3">Kode</th><th>Produk</th><th>Kategori</th><th>Stok</th><th>Harga Beli</th><th>Harga Jual</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${state.products.map(p=>`<tr class="border-b"><td class="py-3">${p.id}</td><td class="font-medium">${p.name}</td><td>${p.category}</td><td>${p.stock} ${p.unit}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td>${p.stock<20?'<span class="text-rose-600 font-semibold">Menipis</span>':'<span class="text-emerald-600">Aman</span>'}</td><td><button onclick="addStock('${p.id}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs">+ Stok Masuk</button></td></tr>`).join('')}</tbody></table></div>`)}
function sales(){shell(`<div class="mb-6"><h2 class="text-3xl font-bold">Penjualan</h2><p class="text-slate-500">Buat transaksi dan generate invoice</p></div><div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 bg-white rounded-xl p-6"><label class="block text-sm font-medium mb-2">Customer</label><select id="cust" class="w-full border rounded-lg p-3 mb-5">${state.customers.map(c=>`<option>${c.name}</option>`).join('')}</select><div class="grid grid-cols-3 gap-3 mb-3"><select id="prod" class="border rounded-lg p-3 col-span-2">${state.products.map(p=>`<option value="${p.id}">${p.name} — ${money(p.sell)}</option>`).join('')}</select><input id="qty" type="number" value="1" min="1" class="border rounded-lg p-3"></div><button onclick="createSale()" class="bg-cyan-600 text-white px-5 py-3 rounded-lg">Simpan Penjualan & Generate Invoice</button></div><div class="bg-slate-900 text-white rounded-xl p-6"><p class="text-slate-400">Cara kerja</p><h3 class="text-xl font-bold mt-2">Stok otomatis berkurang</h3><p class="text-slate-400 mt-3 text-sm">Setelah transaksi disimpan, stok produk dikurangi dan nomor invoice dibuat otomatis.</p></div></div>`)}
function customers(){shell(`<div class="flex justify-between mb-6"><div><h2 class="text-3xl font-bold">Customer</h2><p class="text-slate-500">Data pelanggan dan kontak</p></div><button onclick="addCustomer()" class="bg-cyan-600 text-white px-5 py-3 rounded-lg">+ Tambah Customer</button></div><div class="bg-white rounded-xl p-6"><table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="py-3">Kode</th><th>Nama</th><th>Telepon</th></tr></thead><tbody>${state.customers.map(c=>`<tr class="border-b"><td class="py-3">${c.id}</td><td>${c.name}</td><td>${c.phone}</td></tr>`).join('')}</tbody></table></div>`)}
function reports(){shell(`<div class="mb-6"><h2 class="text-3xl font-bold">Laporan</h2><p class="text-slate-500">Export data ke Excel</p></div><div class="grid md:grid-cols-2 gap-5">${[['Penjualan','Export seluruh transaksi penjualan','exportSales()'],['Stok Produk','Export daftar stok saat ini','exportStock()']].map(x=>`<div class="bg-white rounded-xl p-6 shadow-sm"><h3 class="font-bold text-lg">${x[0]}</h3><p class="text-slate-500 text-sm my-3">${x[1]}</p><button onclick="${x[2]}" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Download Excel</button></div>`).join('')}</div>`)}
function go(p){state.page=p;({dashboard,products,sales,customers,reports}[p])()}
function addStock(id){let p=state.products.find(x=>x.id===id);if(!p)return;let q=Number(prompt('Jumlah stok yang masuk untuk '+p.name+'?',10)||0);if(!Number.isFinite(q)||q<=0){alert('Jumlah stok harus lebih dari 0.');return}let note=prompt('Keterangan (opsional):','Pembelian / stok masuk')||'';p.stock+=q;alert('Stok '+p.name+' berhasil ditambah '+q+' '+p.unit+'. Stok sekarang: '+p.stock+' '+p.unit+'.');products()}
function addProduct(){let n=prompt('Nama produk?');if(!n)return;let h=Number(prompt('Harga jual?',10000)||0);state.products.push({id:'P'+String(state.products.length+1).padStart(3,'0'),name:n,category:'Produk',stock:0,unit:'pcs',buy:0,sell:h});products()}
function addCustomer(){let n=prompt('Nama customer?');if(!n)return;state.customers.push({id:'C'+String(state.customers.length+1).padStart(3,'0'),name:n,phone:prompt('No. telepon?')||'-'});customers()}
function createSale(){let p=state.products.find(x=>x.id===document.getElementById('prod').value),q=Number(document.getElementById('qty').value),c=document.getElementById('cust').value;if(q>p.stock){alert('Stok tidak mencukupi. Stok tersedia: '+p.stock);return}p.stock-=q;let total=p.sell*q,no='INV-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+String(state.sales.length+1).padStart(3,'0');let s={no,date:new Date().toISOString().slice(0,10),customer:c,total,status:'Lunas',items:[{name:p.name,qty:q,price:p.sell}]};state.sales.unshift(s);invoice(s)}
function invoice(s){let {jsPDF}=window.jspdf;let doc=new jsPDF();doc.setFontSize(20);doc.text('INVOICE',150,20);doc.setFontSize(12);doc.text('STOKPRO',20,20);doc.text(s.no,20,32);doc.text('Tanggal: '+s.date,20,40);doc.text('Customer: '+s.customer,20,48);let y=65;doc.text('Produk',20,y);doc.text('Qty',120,y);doc.text('Harga',145,y);doc.text('Total',175,y);y+=10;(s.items||[{name:'Transaksi',qty:1,price:s.total}]).forEach(i=>{doc.text(i.name,20,y);doc.text(String(i.qty),120,y);doc.text(money(i.price),145,y);doc.text(money(i.qty*i.price),175,y);y+=9});doc.line(20,y,195,y);doc.setFontSize(14);doc.text('TOTAL '+money(s.total),120,y+15);doc.save(s.no+'.pdf')}
function exportSales(){let ws=XLSX.utils.json_to_sheet(state.sales.map(s=>({Invoice:s.no,Tanggal:s.date,Customer:s.customer,Total:s.total,Status:s.status})));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Penjualan');XLSX.writeFile(wb,'laporan-penjualan.xlsx')}
function exportStock(){let ws=XLSX.utils.json_to_sheet(state.products.map(p=>({Kode:p.id,Produk:p.name,Kategori:p.category,Stok:p.stock,Satuan:p.unit,Harga_Beli:p.buy,Harga_Jual:p.sell})));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Stok');XLSX.writeFile(wb,'laporan-stok.xlsx')}
go('dashboard');</script></body></html>
